name: showcase-boundary

on:
  push:
    branches: [main]
    paths:
      - "showcase/**"
      - "scripts/verify_showcase.mjs"
      - ".github/workflows/showcase.yml"
  pull_request:
    paths:
      - "showcase/**"
      - "scripts/verify_showcase.mjs"
      - ".github/workflows/showcase.yml"

permissions:
  contents: read

jobs:
  static-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Check public static boundary and references
        run: node scripts/verify_showcase.mjs
