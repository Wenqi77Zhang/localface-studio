name: quality-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.11"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Sync locked Python environment
        run: uv sync --locked --python "$env:pythonLocation\python.exe" --no-managed-python --no-python-downloads
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run public-repository quality gates
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "localface-quality.log"
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\check.ps1 *>&1 |
            Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $tail = (Get-Content $log -Tail 30) -join " | "
            $tail = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=LocalFace quality gate failed::$tail"
            exit $exitCode
          }
