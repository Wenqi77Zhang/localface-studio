name: Bug report
description: Report a reproducible LocalFace Studio defect without sharing private face data
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not upload face photos, generated results, model files, tokens, absolute user paths, or unredacted logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what was expected?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or non-personal test data descriptions only.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or release
      placeholder: Commit hash or version
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Workflow backend
      options: [native-research, simulation, comfyui]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: The report contains no private images, results, model files, credentials, or absolute user paths.
          required: true
